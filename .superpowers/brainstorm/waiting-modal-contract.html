<!doctype html>
<html lang="ko">

    <title>F1Workflow 브레인스토밍 진행 중</title>
    <style>

      <h1>F1-Grid / F1-Tree 전용 모달 방향 선택됨</h1>
      <p>세부 편집 계약을 터미널 대화에서 정리하고 있습니다.</p>
